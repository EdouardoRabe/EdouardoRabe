<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400">
  <defs>
    <clipPath id="svgBounds">
      <rect x="0" y="0" width="900" height="400"/>
    </clipPath>
  </defs>
  
  <style>
    @keyframes fall1 { 0% { transform: translateY(-100%); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translateY(400px); opacity: 0; } }
    @keyframes fall2 { 0% { transform: translateY(-150%); opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { transform: translateY(420px); opacity: 0; } }
    @keyframes fall3 { 0% { transform: translateY(-80%); opacity: 0; } 5% { opacity: 1; } 95% { opacity: 1; } 100% { transform: translateY(380px); opacity: 0; } }
    @keyframes glow { 0%, 100% { fill: #00ff00; } 50% { fill: #00cc00; } }
    @keyframes blink { 0%, 50% { opacity: 1; } 51%, 100% { opacity: 0; } }
    @keyframes walkRight { 0% { transform: translateX(0px) translateY(0); } 100% { transform: translateX(850px) translateY(0); } }
    @keyframes legSwing { 0%, 100% { transform: rotate(-20deg); } 50% { transform: rotate(20deg); } }
    @keyframes armSwing { 0%, 100% { transform: rotate(-10deg); } 50% { transform: rotate(10deg); } }
    @keyframes bodyBounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
    @keyframes typing { 0%, 100% { fill: #00ff00; } 50% { fill: #00aa00; } }
    
    .matrix-bg { fill: #0d1117; }
    .matrix-text { font-family: 'Courier New', monospace; fill: #00ff00; font-size: 14px; }
    .matrix-text-dim { font-family: 'Courier New', monospace; fill: #006600; font-size: 12px; }
    .matrix-text-bright { font-family: 'Courier New', monospace; fill: #00ff00; font-size: 14px; animation: glow 2s infinite; }
    .name-text { font-family: 'Courier New', monospace; fill: #00ff00; font-size: 28px; font-weight: bold; }
    .title-text { font-family: 'Courier New', monospace; fill: #00cc00; font-size: 16px; }
    .cursor { animation: blink 1s infinite; }
    
    .col1 { animation: fall1 4s linear infinite; }
    .col2 { animation: fall2 5s linear infinite 0.3s; }
    .col3 { animation: fall1 4.5s linear infinite 0.6s; }
    .col4 { animation: fall3 3.8s linear infinite 0.9s; }
    .col5 { animation: fall2 4.2s linear infinite 1.2s; }
    .col6 { animation: fall1 5.5s linear infinite 0.2s; }
    .col7 { animation: fall3 4s linear infinite 0.8s; }
    .col8 { animation: fall2 4.8s linear infinite 1.5s; }
    .col9 { animation: fall1 3.5s linear infinite 0.4s; }
    .col10 { animation: fall3 5s linear infinite 1s; }
    .col11 { animation: fall2 4.3s linear infinite 0.7s; }
    .col12 { animation: fall1 4.7s linear infinite 1.3s; }
    .col13 { animation: fall3 5.2s linear infinite 0.1s; }
    .col14 { animation: fall2 3.9s linear infinite 1.1s; }
    .col15 { animation: fall1 4.4s linear infinite 0.5s; }
    
    .walker { animation: walkRight 10s linear infinite; }
    .walker-body { animation: bodyBounce 0.3s ease-in-out infinite; }
    .screen-code { animation: typing 0.5s infinite; }
  </style>
  
  <g clip-path="url(#svgBounds)">
  
  <rect class="matrix-bg" width="100%" height="100%"/>
  
  <!-- ARRIÈRE-PLAN: Colonnes de code tombant (opacity réduite) -->
  <g opacity="0.4">
    <g class="col1">
      <text class="matrix-text" x="20" y="20">Java</text>
      <text class="matrix-text-dim" x="20" y="40">Spring</text>
      <text class="matrix-text" x="20" y="60">Boot</text>
      <text class="matrix-text-dim" x="20" y="80">API</text>
      <text class="matrix-text" x="20" y="100">REST</text>
      <text class="matrix-text-dim" x="20" y="120">MVC</text>
    </g>
    
    <g class="col2">
      <text class="matrix-text" x="80" y="30">Python</text>
      <text class="matrix-text-dim" x="80" y="50">Django</text>
      <text class="matrix-text" x="80" y="70">Flask</text>
      <text class="matrix-text-dim" x="80" y="90">AI</text>
      <text class="matrix-text" x="80" y="110">ML</text>
    </g>
    
    <g class="col3">
      <text class="matrix-text" x="150" y="15">Vue.js</text>
      <text class="matrix-text-dim" x="150" y="35">React</text>
      <text class="matrix-text" x="150" y="55">Ionic</text>
      <text class="matrix-text-dim" x="150" y="75">SPA</text>
      <text class="matrix-text" x="150" y="95">UI/UX</text>
    </g>
    
    <g class="col4">
      <text class="matrix-text" x="220" y="25">C++</text>
      <text class="matrix-text-dim" x="220" y="45">C#</text>
      <text class="matrix-text" x="220" y="65">C</text>
      <text class="matrix-text-dim" x="220" y="85">OOP</text>
      <text class="matrix-text" x="220" y="105">Algo</text>
    </g>
    
    <g class="col5">
      <text class="matrix-text" x="280" y="20">PHP</text>
      <text class="matrix-text-dim" x="280" y="40">Laravel</text>
      <text class="matrix-text" x="280" y="60">Flight</text>
      <text class="matrix-text-dim" x="280" y="80">MVC</text>
    </g>
    
    <g class="col6">
      <text class="matrix-text" x="350" y="35">PostgreSQL</text>
      <text class="matrix-text-dim" x="350" y="55">MySQL</text>
      <text class="matrix-text" x="350" y="75">MongoDB</text>
      <text class="matrix-text-dim" x="350" y="95">Firebase</text>
      <text class="matrix-text" x="350" y="115">SQLite</text>
    </g>
    
    <g class="col7">
      <text class="matrix-text" x="450" y="10">Docker</text>
      <text class="matrix-text-dim" x="450" y="30">Git</text>
      <text class="matrix-text" x="450" y="50">GitHub</text>
      <text class="matrix-text-dim" x="450" y="70">CI/CD</text>
      <text class="matrix-text" x="450" y="90">DevOps</text>
    </g>
    
    <g class="col8">
      <text class="matrix-text" x="520" y="25">Figma</text>
      <text class="matrix-text-dim" x="520" y="45">Photoshop</text>
      <text class="matrix-text" x="520" y="65">Illustrator</text>
      <text class="matrix-text-dim" x="520" y="85">InDesign</text>
      <text class="matrix-text" x="520" y="105">Premiere</text>
    </g>
    
    <g class="col9">
      <text class="matrix-text" x="620" y="15">Looping</text>
      <text class="matrix-text-dim" x="620" y="35">dbSchema</text>
      <text class="matrix-text" x="620" y="55">UML</text>
      <text class="matrix-text-dim" x="620" y="75">Merise</text>
    </g>
    
    <g class="col10">
      <text class="matrix-text" x="700" y="30">Node.js</text>
      <text class="matrix-text-dim" x="700" y="50">Express</text>
      <text class="matrix-text" x="700" y="70">NPM</text>
      <text class="matrix-text-dim" x="700" y="90">Yarn</text>
    </g>
    
    <g class="col11">
      <text class="matrix-text" x="780" y="20">VB</text>
      <text class="matrix-text-dim" x="780" y="40">.NET</text>
      <text class="matrix-text" x="780" y="60">WinForms</text>
      <text class="matrix-text-dim" x="780" y="80">Desktop</text>
    </g>
    
    <g class="col12">
      <text class="matrix-text" x="850" y="35">Postman</text>
      <text class="matrix-text-dim" x="850" y="55">API</text>
      <text class="matrix-text" x="850" y="75">Testing</text>
    </g>
    
    <g class="col13">
      <text class="matrix-text-dim" x="55" y="20">01100101</text>
      <text class="matrix-text-dim" x="55" y="40">01100100</text>
      <text class="matrix-text-dim" x="55" y="60">01101111</text>
    </g>
    
    <g class="col14">
      <text class="matrix-text-dim" x="185" y="25">{code}</text>
      <text class="matrix-text-dim" x="185" y="45">function</text>
      <text class="matrix-text-dim" x="185" y="65">class</text>
    </g>
    
    <g class="col15">
      <text class="matrix-text-dim" x="580" y="30">import</text>
      <text class="matrix-text-dim" x="580" y="50">export</text>
      <text class="matrix-text-dim" x="580" y="70">async</text>
    </g>
  </g>
  
  <!-- PREMIER PLAN: Contenu principal avec fond opaque -->
  <g>
    <rect x="150" y="130" width="600" height="130" fill="#0d1117" fill-opacity="0.95" rx="8"/>
    <rect x="150" y="130" width="600" height="130" fill="none" stroke="#00ff00" stroke-width="1" stroke-opacity="0.4" rx="8"/>
    
    <text class="name-text" x="450" y="175" text-anchor="middle">&gt; EdouardoRabe_<tspan class="cursor">█</tspan></text>
    <text class="title-text" x="450" y="205" text-anchor="middle">Software Engineer · Antananarivo, Madagascar</text>
    
    <line x1="200" y1="220" x2="700" y2="220" stroke="#00ff00" stroke-width="1" stroke-opacity="0.3"/>
    
    <text fill="#00aa00" x="450" y="245" text-anchor="middle" font-family="monospace" font-size="11">Full Stack Developer | Java · Spring · Vue.js · PostgreSQL · Docker</text>
  </g>
  
  <!-- Barre de titre style terminal -->
  <rect x="10" y="10" width="880" height="25" fill="#161b22" rx="3"/>
  <circle cx="25" cy="22" r="5" fill="#ff5f56"/>
  <circle cx="45" cy="22" r="5" fill="#ffbd2e"/>
  <circle cx="65" cy="22" r="5" fill="#27c93f"/>
  <text x="450" y="27" text-anchor="middle" fill="#8b949e" font-family="monospace" font-size="12">edouardo@dev: ~/portfolio</text>
  
  <!-- PERSONNAGE QUI MARCHE EN BAS - entre les infos et le contact -->
  <g transform="translate(0, 280)">
    <g class="walker">
      <g class="walker-body">
        <!-- Tête -->
        <circle cx="25" cy="10" r="7" fill="#00cc00"/>
        <!-- Cheveux -->
        <path d="M18 4 Q25 -1 32 4" stroke="#008800" stroke-width="2" fill="none"/>
        <!-- Œil (regarde vers la droite) -->
        <circle cx="28" cy="9" r="1.2" fill="#0d1117"/>
        
        <!-- Corps/Torse -->
        <rect x="18" y="18" width="14" height="16" rx="2" fill="#00aa00"/>
        
        <!-- Bras gauche (tient le laptop) -->
        <line x1="18" y1="22" x2="8" y2="30" stroke="#00aa00" stroke-width="3" stroke-linecap="round"/>
        <!-- Main gauche -->
        <circle cx="8" cy="30" r="2.5" fill="#00cc00"/>
        
        <!-- Bras droit (sur le clavier) -->
        <line x1="32" y1="22" x2="42" y2="28" stroke="#00aa00" stroke-width="3" stroke-linecap="round"/>
        <!-- Main droite -->
        <circle cx="42" cy="28" r="2.5" fill="#00cc00"/>
        
        <!-- LAPTOP -->
        <g transform="translate(3, 24)">
          <!-- Base du laptop -->
          <rect x="0" y="0" width="38" height="3" fill="#444" rx="1"/>
          <!-- Écran du laptop -->
          <rect x="2" y="-14" width="34" height="14" fill="#1a1a2e" stroke="#555" stroke-width="1" rx="2"/>
          <!-- Code sur l'écran -->
          <rect class="screen-code" x="5" y="-11" width="10" height="2" fill="#00ff00"/>
          <rect x="5" y="-8" width="18" height="2" fill="#006600"/>
          <rect class="screen-code" x="5" y="-5" width="14" height="2" fill="#00ff00"/>
        </g>
        
        <!-- Jambe gauche (animée) -->
        <g>
          <line x1="21" y1="34" x2="17" y2="48" stroke="#008800" stroke-width="4" stroke-linecap="round">
            <animate attributeName="x2" values="17;25;17" dur="0.4s" repeatCount="indefinite"/>
          </line>
          <!-- Pied gauche -->
          <ellipse cx="17" cy="50" rx="4" ry="2" fill="#006600">
            <animate attributeName="cx" values="17;25;17" dur="0.4s" repeatCount="indefinite"/>
          </ellipse>
        </g>
        
        <!-- Jambe droite (animée, décalée) -->
        <g>
          <line x1="29" y1="34" x2="33" y2="48" stroke="#008800" stroke-width="4" stroke-linecap="round">
            <animate attributeName="x2" values="33;25;33" dur="0.4s" repeatCount="indefinite"/>
          </line>
          <!-- Pied droit -->
          <ellipse cx="33" cy="50" rx="4" ry="2" fill="#006600">
            <animate attributeName="cx" values="33;25;33" dur="0.4s" repeatCount="indefinite"/>
          </ellipse>
        </g>
      </g>
    </g>
  </g>
  
  <!-- Contact en bas -->
  <text fill="#008800" x="450" y="390" text-anchor="middle" font-family="monospace" font-size="10">$ contact → edouardorabendrazana@gmail.com | github.com/EdouardoRabe</text>
  
  <!-- Bordures style terminal -->
  <rect x="5" y="5" width="890" height="390" fill="none" stroke="#00ff00" stroke-width="1" stroke-opacity="0.3" rx="5"/>
  
  </g>
</svg>